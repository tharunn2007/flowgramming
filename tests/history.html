<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Undo/redo integration tests</title>
    </head>
    <body>
        <h1>Undo/redo integration tests</h1>
        <p>
            Runs in an isolated app frame. Your other open flowcharts are
            unaffected.
        </p>
        <pre id="results">Running…</pre>
        <iframe
            id="app"
            title="Test flowchart"
            style="width: 100%; height: 700px"
        ></iframe>
        <script>
            const frame = document.getElementById('app')
            window.addEventListener('message', function (event) {
                if (
                    event.source !== frame.contentWindow ||
                    event.origin !== location.origin
                )
                    return
                if (event.data.type !== 'history-test-results') return
                document.getElementById('results').textContent =
                    event.data.results
            })
            frame.onload = function () {
                const script = frame.contentDocument.createElement('script')
                script.src = 'tests/history-browser.js'
                frame.contentDocument.body.appendChild(script)
            }
            frame.src = '../index.html'
        </script>
    </body>
</html>
